<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daggertop</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dh_theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <link rel="stylesheet" href="/styles.css" />
  <link id="hljs-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('dh_theme') === 'light') {
          var l = document.getElementById('hljs-theme');
          if (l) l.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css';
        }
      } catch (e) {}
    })();
  </script>

  <!--
    Import map: maps bare module specifiers to CDN ESM URLs.
    esbuild bundles our code with these marked external, so they
    resolve to the CDN at runtime via this map.
  -->
  <script type="importmap">
  {
    "imports": {
      "react":              "https://esm.sh/react@18",
      "react/jsx-runtime":  "https://esm.sh/react@18/jsx-runtime",
      "react-dom":          "https://esm.sh/react-dom@18",
      "react-dom/client":   "https://esm.sh/react-dom@18/client",
      "firebase/app":       "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
      "firebase/auth":      "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
      "lucide-react":       "https://esm.sh/lucide-react@latest?external=react",
      "marked":             "https://esm.sh/marked@latest",
      "highlight.js":       "https://esm.sh/highlight.js@latest",
      "@3d-dice/dice-box-threejs": "/dice-threejs/dice-box-threejs.es.js"
    }
  }
  </script>
</head>
<body class="min-h-screen bg-dh-canvas text-dh">
  <div id="root"></div>

  <!-- Bump ?v= when shipping client bundle changes so browsers don’t keep a stale cached app.js -->
  <script type="module" src="/app.js?v=library-preview-3"></script>
  <script>
    (function() {
      var src = new EventSource('/livereload');
      var wasConnected = false;
      src.onopen = function() { if (wasConnected) location.reload(); };
      src.onmessage = function(e) {
        wasConnected = true;
        if (e.data === 'reload') location.reload();
      };
    })();
  </script>
</body>
</html>
